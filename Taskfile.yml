version: "3"

tasks:
    winres:
        desc: Compile windows resources
        cmds:
            - go-winres.exe make --output app/
        sources:
            - winres/**/*

    build:
        desc: Build the project
        deps: [winres]
        cmds:
            - go build -o vye.exe ./app

    release:
        cmds:
            - go build -trimpath -ldflags "-s -w -H=windowsgui" -o vye.exe ./app
